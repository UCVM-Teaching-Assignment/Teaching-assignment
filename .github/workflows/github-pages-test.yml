name: GitHub Pages Test Site

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-test
  cancel-in-progress: true

jobs:
  verify_build_and_deploy:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Require this PR's Change Log entry
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          node tools/check-pr-changelog.js --pr "${{ github.event.pull_request.number }}" --base "${{ github.event.pull_request.base.sha }}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      # The ported PAWS suites live in server/ and need exceljs, jszip, pdf-lib
      # and unzipper. Root `npm ci` does not install them.
      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Run static and unit tests
        run: npm run test:all

      - name: Run Firestore and Auth emulator tests
        run: npm run test:emulator

      # The legacy web/ app still builds so its tests keep guarding it, but the
      # test site now publishes the PAWS (beta) pages with in-browser demo data.
      - name: Build static site
        run: node tools/build-static.js

      - name: Build PAWS pages with demo API
        run: node tools/build-paws-pages.js

      - name: Stage GitHub Pages frontend demo
        run: >-
          node tools/stage-github-pages.js
          --directory .deploy-static
          --mode paws
          --pr "${{ github.event.pull_request.number }}"
          --head-sha "${{ github.event.pull_request.head.sha }}"
          --build-sha "${{ github.event.pull_request.head.sha }}"

      - name: Browser smoke staged frontend demo
        env:
          PAWS_OFFICE_SCREENSHOT_DIR: ${{ runner.temp }}/paws-office-evidence
        run: node tools/paws-browser-smoke.js

      - name: Upload ADFAD Office browser evidence
        uses: actions/upload-artifact@v7
        with:
          name: paws-adfad-office-browser-evidence
          path: ${{ runner.temp }}/paws-office-evidence
          if-no-files-found: error

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        id: pages-artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: .deploy-static
          include-hidden-files: true

      - name: Wait for the uploaded Pages artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.pages-artifact.outputs.artifact_id }}
        run: |
          if [[ ! "$PAGES_ARTIFACT_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Pages upload did not return an artifact ID."
            exit 1
          fi
          for attempt in {1..10}; do
            sleep 5
            visible=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$PAGES_ARTIFACT_NAME" \
              --jq ".artifacts | any(.id == $PAGES_ARTIFACT_ID and .expired == false)") || continue
            if [[ "$visible" == true ]]; then
              echo "Pages artifact $PAGES_ARTIFACT_ID is available."
              exit 0
            fi
          done
          echo "::error::The uploaded Pages artifact is still missing from this run's artifact list."
          exit 1

      - name: Deploy GitHub Pages test site
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
